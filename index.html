#topbar h1{font-size:.8rem;font-weight:600;white-space:nowrap;color:var(--text)}
#topbar h1 span{color:var(--muted);font-weight:400}
#search{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:.75rem;width:140px;outline:none;flex-shrink:0}
#search:focus{border-color:#58a6ff}
#search::placeholder{color:var(--muted)}
.filters{display:flex;gap:4px;flex-wrap:nowrap}
.chip{padding:2px 8px;border-radius:20px;font-size:.68rem;cursor:pointer;border:1px solid transparent;transition:opacity .15s;font-weight:500;opacity:.45;white-space:nowrap}
.chip.active{opacity:1}
.chip[data-type=person]{background:#58a6ff22;border-color:var(--person);color:var(--person)}
.chip[data-type=event]{background:#f0883e22;border-color:var(--event);color:var(--event)}
.chip[data-type=law]{background:#7ee78722;border-color:var(--law);color:var(--law)}
.chip[data-type=institution]{background:#d2a8ff22;border-color:var(--institution);color:var(--institution)}
.chip[data-type=concept]{background:#79c0ff22;border-color:var(--concept);color:var(--concept)}
.chip[data-type=date]{background:#ffa65722;border-color:var(--date);color:var(--date)}
.chip[data-type=sport]{background:#ff7b7222;border-color:var(--sport);color:var(--sport)}
.mode-btn,.lang-btn{padding:3px 9px;border-radius:6px;font-size:.72rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;white-space:nowrap;flex-shrink:0}
.mode-btn.active,.lang-btn.active{background:#21262d;color:var(--text);border-color:#8b949e}
#main{display:flex;flex:1;overflow:hidden}
#graph-container{flex:1;position:relative}
svg{width:100%;height:100%}
#panel{width:300px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);transition:transform .2s ease;flex-shrink:0}
#panel.open{transform:translateX(0)}
#panel-header{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:7px}
#panel-type-badge{font-size:.65rem;padding:2px 7px;border-radius:10px;font-weight:600;margin-top:2px;flex-shrink:0}
#panel-title{font-size:.95rem;font-weight:700;line-height:1.3}
#panel-subtitle{font-size:.72rem;color:var(--muted);margin-top:2px}
#panel-close{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 2px;flex-shrink:0}
#panel-body{flex:1;overflow-y:auto;padding:10px 14px}
#panel-body::-webkit-scrollbar{width:3px}
#panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.facts-table{width:100%;border-collapse:collapse;font-size:.75rem;margin-bottom:12px}
.facts-table td{padding:4px 0;border-bottom:1px solid #21262d;vertical-align:top}
.facts-table td:first-child{color:var(--muted);width:36%;padding-right:6px}
.rel-section{margin-bottom:10px}
.rel-label{font-size:.65rem;color:var(--muted);margin-bottom:3px;font-weight:600}
.rel-chips{display:flex;flex-wrap:wrap;gap:3px}
.rel-chip{font-size:.68rem;padding:2px 7px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:#21262d;color:var(--text);transition:background .1s}
.rel-chip:hover{background:#2d333b}
#quiz-section{margin-top:4px;border-top:1px solid var(--border);padding-top:10px}
.quiz-label{font-size:.65rem;color:var(--muted);font-weight:600;margin-bottom:7px}
.quiz-card{background:var(--quiz-bg);border:1px solid var(--border);border-radius:7px;padding:10px}
.quiz-q{font-size:.79rem;line-height:1.5;margin-bottom:9px}
.quiz-answer{display:none;font-size:.75rem;color:var(--law);line-height:1.5;margin-bottom:7px;padding:7px;background:#12261a;border-radius:4px}
.quiz-answer.shown{display:block}
.quiz-btn{width:100%;padding:6px;border-radius:5px;font-size:.75rem;cursor:pointer;border:1px solid var(--border);background:#21262d;color:var(--text);transition:background .1s}
.quiz-btn:hover{background:#2d333b}
#timeline-bar{height:0;overflow:hidden;background:var(--panel);border-top:1px solid var(--border);transition:height .2s ease;flex-shrink:0}
#timeline-bar.open{height:76px}
#timeline-inner{padding:8px 14px;display:flex;align-items:center;gap:0;height:100%;overflow-x:auto}
.tl-era{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:0 8px}
.tl-era-label{font-size:.62rem;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.tl-bar{height:4px;border-radius:2px;width:52px}
.tl-era:hover .tl-era-label{color:var(--text)}
#tooltip{position:absolute;pointer-events:none;background:#21262d;border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-size:.72rem;color:var(--text);display:none;z-index:20;max-width:180px}
.node-label{font-size:9px;fill:var(--text);pointer-events:none}
#legend{position:absolute;bottom:10px;left:10px;background:#161b22cc;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:.67rem;color:var(--muted);backdrop-filter:blur(4px)}
#legend div{display:flex;align-items:center;gap:5px;margin-bottom:2px}
#legend div:last-child{margin-bottom:0}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.leg-line{width:14px;height:2px;flex-shrink:0;border-radius:1px}
.node-dimmed{opacity:.15}
#stats{position:absolute;top:8px;right:8px;background:#161b22cc;border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-size:.67rem;color:var(--muted)}
#empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);font-size:.82rem;pointer-events:none;display:none}
</style>
</head>

// ─── GLOBALS ───────────────────────────────────────────────
let lang='zh',mode='graph';
let activeTypes=new Set(['person','event','law','institution','concept','date','sport']);
let selectedNode=null,quizRevealed=false;
let simulation,nodeG,linkSel,labelSel;

function init(){updateLegend();buildGraph();buildTimeline();}

function setLang(l){
  lang=l;
  document.getElementById('btn-zh').classList.toggle('active',l==='zh');
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  updateLegend();if(labelSel)labelSel.text(d=>d.en);
  if(selectedNode)openPanel(selectedNode);
  buildTimeline();
}

function setMode(m){
  mode=m;
  document.getElementById('btn-graph').classList.toggle('active',m==='graph');
  document.getElementById('btn-timeline').classList.toggle('active',m==='timeline');
  document.getElementById('timeline-bar').classList.toggle('open',m==='timeline');
  if(m==='timeline')applyTimeline();else restoreGraph();
}

function updateLegend(){
  document.querySelectorAll('.leg-label').forEach(el=>{el.textContent=el.dataset[lang]||el.dataset.zh;});
  document.getElementById('stats').textContent=`${N.length} 節點 nodes · ${L.length} 關係 links`;
}

// ─── GRAPH ─────────────────────────────────────────────────
function buildGraph(){
  const svg=d3.select('#svg');svg.selectAll('*').remove();
  const C=document.getElementById('graph-container');
  const W=C.clientWidth,H=C.clientHeight;
  const g=svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.1,5]).on('zoom',e=>g.attr('transform',e.transform)));
  const defs=svg.append('defs');
  Object.entries(RC).forEach(([r,c])=>{
    defs.append('marker').attr('id','arr-'+r).attr('viewBox','0 -5 10 10')
      .attr('refX',20).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
      .append('path').attr('d','M0,-5L10,0L0,5').attr('fill',c).attr('opacity',0.6);
  });
  const vis=N.filter(n=>activeTypes.has(n.type));
  const visIds=new Set(vis.map(n=>n.id));
  const deg={};vis.forEach(n=>deg[n.id]=0);
  const visL=L.filter(l=>visIds.has(l.s)&&visIds.has(l.t));
  visL.forEach(l=>{deg[l.s]=(deg[l.s]||0)+1;deg[l.t]=(deg[l.t]||0)+1;});
  const nodes=vis.map(d=>({...d}));
  const links=visL.map(d=>({source:d.s,target:d.t,rel:d.r}));
  simulation=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(65).strength(0.3))
    .force('charge',d3.forceManyBody().strength(-180))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>nodeR(d,deg)+10));
  linkSel=g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke',d=>RC[d.rel]||'#6e7681').attr('stroke-width',1.1)
    .attr('stroke-opacity',0.45).attr('marker-end',d=>`url(#arr-${d.rel})`);
  nodeG=g.append('g').selectAll('g').data(nodes).join('g')
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on('click',(e,d)=>{e.stopPropagation();openPanel(d);})
    .on('mouseenter',(e,d)=>showTT(e,d.en))
    .on('mouseleave',()=>document.getElementById('tooltip').style.display='none');
  nodeG.append('circle')
    .attr('r',d=>nodeR(d,deg)).attr('fill',d=>TC[d.type])
    .attr('fill-opacity',0.82).attr('stroke',d=>TC[d.type]).attr('stroke-width',1.5);
  labelSel=nodeG.append('text').attr('class','node-label')
    .attr('text-anchor','middle').attr('dy',d=>nodeR(d,deg)+10)
    .text(d=>d.en);
  simulation.on('tick',()=>{
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
           .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeG.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
  svg.on('click',()=>closePanel());
}

function nodeR(d,deg){const b={person:7,event:6,law:5,institution:7,concept:5,date:5,sport:5};return(b[d.type]||5)+Math.min((deg[d.id]||0)*1.1,9);}

function applyTimeline(){
  if(!simulation)return;
  const C=document.getElementById('graph-container');
  const W=C.clientWidth,H=C.clientHeight;
  const eras=[...new Set(N.map(n=>n.era))].sort((a,b)=>ERA_ORDER.indexOf(a)-ERA_ORDER.indexOf(b));
  const x=d3.scalePoint().domain(eras).range([80,W-80]).padding(0.5);
  simulation.force('x',d3.forceX(d=>x(d.era)).strength(0.85))
            .force('y',d3.forceY(H/2).strength(0.25)).alpha(0.5).restart();
}
function restoreGraph(){
  if(!simulation)return;
  const C=document.getElementById('graph-container');
  simulation.force('x',null).force('y',null)
    .force('center',d3.forceCenter(C.clientWidth/2,C.clientHeight/2)).alpha(0.5).restart();
}

// ─── PANEL ─────────────────────────────────────────────────
const TL={zh:{person:'人物',event:'事件',law:'法律',institution:'機構',concept:'概念',date:'年份',sport:'體育文化'},
          en:{person:'Person',event:'Event',law:'Law',institution:'Institution',concept:'Concept',date:'Date',sport:'Sport/Culture'}};
const RL={zh:{caused:'→ 導致',created:'→ 創立',part_of:'→ 屬於',chronological:'→ 時序','led_to':'→ 間接導致','survived':'→ 涉及',
              '← caused':'← 導致自','← created':'← 由⋯創立','← part_of':'← 包含','← chronological':'← 時序前','← led_to':'← 間接被導致','← survived':'← 涉及'},
          en:{caused:'→ caused',created:'→ created',part_of:'→ part of',chronological:'→ next in time','led_to':'→ led to','survived':'→ involved',
              '← caused':'← caused by','← created':'← created by','← part_of':'← contains','← chronological':'← preceded by','← led_to':'← led to by','← survived':'← involved in'}};

function openPanel(d){
  selectedNode=d;quizRevealed=false;
  document.getElementById('panel').classList.add('open');
  const b=document.getElementById('panel-type-badge');
  b.textContent=TL[lang][d.type]||d.type;
  b.style.cssText=`background:${TC[d.type]}33;color:${TC[d.type]};border:1px solid ${TC[d.type]}66`;
  document.getElementById('panel-title').textContent=d.en;
  document.getElementById('panel-subtitle').textContent=lang==='zh'?d.zh:'';
  const f=d.facts[lang]||d.facts.zh;
  document.getElementById('facts-table').innerHTML=Object.entries(f).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  const rels={};
  L.forEach(l=>{
    const sid=typeof l.source==='object'?l.source.id:l.s||l.source;
    const tid=typeof l.target==='object'?l.target.id:l.t||l.target;
    if(sid===d.id){if(!rels[l.r||l.rel])rels[l.r||l.rel]=[];const n=N.find(x=>x.id===tid);if(n)rels[l.r||l.rel].push(n);}
    if(tid===d.id){const rk='← '+(l.r||l.rel);if(!rels[rk])rels[rk]=[];const n=N.find(x=>x.id===sid);if(n)rels[rk].push(n);}
  });
  document.getElementById('relations-section').innerHTML=Object.entries(rels).map(([rel,ns])=>`
    <div class="rel-section"><div class="rel-label">${RL[lang][rel]||rel}</div>
    <div class="rel-chips">${ns.map(n=>`<span class="rel-chip" onclick="openPanel(N.find(x=>x.id==='${n.id}'))" style="border-color:${TC[n.type]}44;color:${TC[n.type]}">${n.en}</span>`).join('')}</div></div>`).join('');
  const q=d.quiz[lang]||d.quiz.zh;
  document.getElementById('quiz-label').textContent=lang==='zh'?'📝 快速測試':'📝 Quick Quiz';
  document.getElementById('quiz-q').textContent=q.q;
  document.getElementById('quiz-answer').textContent=q.a;
  document.getElementById('quiz-answer').classList.remove('shown');
  document.getElementById('quiz-btn').textContent=lang==='zh'?'顯示答案':'Reveal Answer';
  document.getElementById('quiz-btn').onclick=toggleQuiz;
  if(nodeG)nodeG.classed('node-dimmed',nd=>nd.id!==d.id);
}
function closePanel(){document.getElementById('panel').classList.remove('open');selectedNode=null;if(nodeG)nodeG.classed('node-dimmed',false);}
function toggleQuiz(){
  quizRevealed=!quizRevealed;
  document.getElementById('quiz-answer').classList.toggle('shown',quizRevealed);
  const btn=document.getElementById('quiz-btn');
  if(quizRevealed){btn.textContent=lang==='zh'?'下一題 →':'Next →';btn.onclick=nextQuiz;}
  else{btn.textContent=lang==='zh'?'顯示答案':'Reveal Answer';btn.onclick=toggleQuiz;}
}
function nextQuiz(){const vis=N.filter(n=>activeTypes.has(n.type));openPanel(vis[Math.floor(Math.random()*vis.length)]);}

// ─── TIMELINE BAR ──────────────────────────────────────────
function buildTimeline(){
  const inner=document.getElementById('timeline-inner');
  const eras=[
    {k:'roman',zh:'羅馬',en:'Roman',c:'#79c0ff'},
    {k:'anglo-saxon',zh:'盎格魯-撒克遜',en:'Anglo-Saxon',c:'#7ee787'},
    {k:'norman',zh:'諾曼',en:'Norman',c:'#f0883e'},
    {k:'medieval',zh:'中世紀',en:'Medieval',c:'#d2a8ff'},
    {k:'tudor',zh:'都鐸',en:'Tudor',c:'#58a6ff'},
    {k:'stuart',zh:'斯圖亞特',en:'Stuart',c:'#ffa657'},
    {k:'georgian',zh:'喬治',en:'Georgian',c:'#ff7b72'},
    {k:'victorian',zh:'維多利亞',en:'Victorian',c:'#f0883e'},
    {k:'modern',zh:'現代',en:'Modern',c:'#58a6ff'},
  ];
  inner.innerHTML=eras.map(e=>`
    <div class="tl-era" onclick="filterEra('${e.k}')">
      <div class="tl-era-label">${e[lang]||e.zh}</div>
      <div class="tl-bar" style="background:${e.c}"></div>
    </div>`).join('<div style="width:1px;height:18px;background:#30363d;margin:0 3px"></div>');
}
function filterEra(era){if(nodeG)nodeG.classed('node-dimmed',d=>d.era!==era);}

// ─── FILTER CHIPS ──────────────────────────────────────────
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    const t=chip.dataset.type;
    chip.classList.toggle('active');
    if(activeTypes.has(t))activeTypes.delete(t);else activeTypes.add(t);
    buildGraph();if(mode==='timeline')applyTimeline();
  });
});

// ─── SEARCH ────────────────────────────────────────────────
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  const empty=document.getElementById('empty');
  if(!q){if(nodeG)nodeG.classed('node-dimmed',false).classed('node-highlighted',false);empty.style.display='none';return;}
  let found=0;
  if(nodeG){nodeG.each(function(d){const m=d.zh.toLowerCase().includes(q)||d.en.toLowerCase().includes(q);d3.select(this).classed('node-dimmed',!m);if(m)found++;});}
  empty.style.display=found===0?'block':'none';
});

// ─── TOOLTIP ───────────────────────────────────────────────
function showTT(e,text){const tt=document.getElementById('tooltip');tt.textContent=text;tt.style.cssText=`display:block;left:${e.offsetX+12}px;top:${e.offsetY-10}px`;}

// ─── RESIZE ────────────────────────────────────────────────
window.addEventListener('resize',()=>{if(simulation){const C=document.getElementById('graph-container');simulation.force('center',d3.forceCenter(C.clientWidth/2,C.clientHeight/2)).alpha(0.3).restart();}});

init();
</script>
